[package]
name = "necromat"
version = "1.0.1"
edition = "2024"
description = "NECROTIC MATHEMATICS: a TUI calculator"
license = "WTFPL"
repository = "https://github.com/nclark/necromat"
readme = "README.md"
rust-version = "1.95"
keywords = ["calculator", "tui", "vim", "terminal"]
categories = ["command-line-utilities", "mathematics"]
exclude = ["tests/", ".beads/", "doc/", "justfile", "mise.toml", "AGENTS.md"]

[[bin]]
name = "nm"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
crossterm = { version = "0.29.0", features = ["osc52"] }
hjkl-buffer = "=0.42.2"
hjkl-engine = { version = "=0.42.2", default-features = false }
hjkl-vim = "=0.42.2"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
